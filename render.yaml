# Blueprint de Render: crea el backend (Node) y la base de datos (PostgreSQL).
# En Render: New → Blueprint → elige este repositorio. Guía en docs/DESPLIEGUE_RENDER.md
services:
  - type: web
    name: drj-backend
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci --include=dev && npm run build -w backend
    # Antes de arrancar: migraciones, datos demo (si CARGAR_DEMO=true) y primer admin.
    startCommand: npm run preparar -w backend && npm start -w backend
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: drj-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: CORS_ORIGENES
        value: https://sebastianjaimesr.github.io
      - key: CONFIAR_PROXY
        value: "1"
      # Datos FICTICIOS de demostración (DEMO-*). Pon "false" cuando cargues el inventario real.
      - key: CARGAR_DEMO
        value: "true"
      # Render te los pide al crear el Blueprint (no quedan en git).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Fotos de productos en Supabase Storage (docs/CONFIGURACION_SERVICIOS.md § 6).
      # Mientras no las llenes, el servidor arranca igual y el panel avisa que las imágenes no están configuradas.
      - key: ALMACENAMIENTO
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: productos
      # Pagos en línea con Wompi (docs/CONFIGURACION_SERVICIOS.md § 7). Vacías = sin pago en línea:
      # el pedido queda con pago pendiente y lo confirma un asesor.
      - key: WOMPI_LLAVE_PUBLICA
        sync: false
      - key: WOMPI_SECRETO_INTEGRIDAD
        sync: false
      - key: WOMPI_SECRETO_EVENTOS
        sync: false
      # URL pública de la tienda (para volver al pedido después de pagar), p. ej. https://sebastianjaimesr.github.io/Don_Respuestos_Jaimes
      - key: TIENDA_URL
        sync: false
      # Jaimes AI (docs/CONFIGURACION_SERVICIOS.md § 8). Sin la clave, el chat usa el motor de reglas.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: IA_MODELO
        value: claude-opus-5-5
      - key: IA_ESFUERZO
        value: low
      - key: IA_MAX_HERRAMIENTAS
        value: "6"
      - key: IA_LIMITE_DIARIO_MENSAJES
        value: "500"

databases:
  - name: drj-db
    plan: free
    region: virginia
    databaseName: drj
    user: drj
    postgresMajorVersion: "16"
